<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7f7f7"/>
      <stop offset="1" stop-color="#ecdce6"/>
    </linearGradient>
    <linearGradient id="busBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7e7e7"/>
    </linearGradient>
    <linearGradient id="busStripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fb8"/>
      <stop offset="1" stop-color="#ec008b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#skyGrad)"/>

  <!-- distant skyline, kept abstract -->
  <g opacity="0.35" fill="#bebebe">
    <rect x="60" y="380" width="50" height="150"/>
    <rect x="130" y="340" width="40" height="190"/>
    <rect x="190" y="400" width="60" height="130"/>
    <rect x="960" y="360" width="45" height="170"/>
    <rect x="1020" y="410" width="55" height="120"/>
    <rect x="1090" y="380" width="40" height="150"/>
  </g>

  <!-- diamond accents in the sky -->
  <g opacity="0.5">
    <polygon points="900,90 940,130 900,190 860,130" fill="#ec008b" opacity="0.25"/>
    <polygon points="220,120 250,150 220,195 190,150" fill="#bebebe" opacity="0.4"/>
  </g>

  <!-- road -->
  <rect x="0" y="560" width="1200" height="140" fill="#3a3a3a"/>
  <rect x="0" y="556" width="1200" height="6" fill="#bebebe"/>
  <g fill="#f7f7f7" opacity="0.8">
    <rect x="40" y="628" width="90" height="10" rx="5"/>
    <rect x="220" y="628" width="90" height="10" rx="5"/>
    <rect x="400" y="628" width="90" height="10" rx="5"/>
    <rect x="580" y="628" width="90" height="10" rx="5"/>
    <rect x="760" y="628" width="90" height="10" rx="5"/>
    <rect x="940" y="628" width="90" height="10" rx="5"/>
    <rect x="1120" y="628" width="90" height="10" rx="5"/>
  </g>

  <!-- coach bus, side view -->
  <g>
    <rect x="180" y="330" width="760" height="230" rx="34" fill="url(#busBody)" stroke="#d5d5d5" stroke-width="2"/>
    <rect x="180" y="430" width="760" height="34" fill="url(#busStripe)"/>

    <!-- windshield -->
    <path d="M 900 360 Q 950 360 955 400 L 958 430 L 900 430 Z" fill="#cfe0e6" opacity="0.9"/>

    <!-- passenger windows -->
    <g fill="#cfe0e6">
      <rect x="215" y="360" width="80" height="60" rx="10"/>
      <rect x="310" y="360" width="80" height="60" rx="10"/>
      <rect x="405" y="360" width="80" height="60" rx="10"/>
      <rect x="500" y="360" width="80" height="60" rx="10"/>
      <rect x="595" y="360" width="80" height="60" rx="10"/>
      <rect x="690" y="360" width="80" height="60" rx="10"/>
      <rect x="785" y="360" width="80" height="60" rx="10"/>
    </g>

    <!-- diamond emblem -->
    <polygon points="220,480 240,500 220,528 200,500" fill="#ec008b"/>

    <!-- brand wordmark -->
    <text x="270" y="512" font-family="'Jost','Poppins',sans-serif" font-size="26" letter-spacing="3" fill="#4a4a4a">VIA&#199;&#195;O DIAMANTE</text>

    <!-- door -->
    <rect x="855" y="440" width="60" height="118" rx="8" fill="#e2e2e2" stroke="#cacaca" stroke-width="2"/>

    <!-- bumper -->
    <rect x="180" y="558" width="760" height="14" rx="6" fill="#d5d5d5"/>

    <!-- wheels -->
    <circle cx="300" cy="572" r="42" fill="#2b2b2b"/>
    <circle cx="300" cy="572" r="16" fill="#bebebe"/>
    <circle cx="800" cy="572" r="42" fill="#2b2b2b"/>
    <circle cx="800" cy="572" r="16" fill="#bebebe"/>
  </g>
</svg>
