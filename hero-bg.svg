<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="heroBase" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7f7f7"/>
      <stop offset="0.55" stop-color="#f2eef1"/>
      <stop offset="1" stop-color="#e9d3e2"/>
    </linearGradient>
    <radialGradient id="heroGlowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec008b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ec008b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroGlowGray" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bebebe" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#bebebe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diamondTop" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ec008b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="diamondBottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ec008b" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#heroBase)"/>

  <circle cx="1250" cy="180" r="420" fill="url(#heroGlowPink)"/>
  <circle cx="220" cy="720" r="380" fill="url(#heroGlowGray)"/>

  <!-- diamond cluster, top-right -->
  <g opacity="0.9">
    <polygon points="1080,260 1250,10 1420,260" fill="url(#diamondTop)"/>
    <polygon points="1080,260 1250,510 1420,260" fill="url(#diamondBottom)"/>
    <polygon points="990,150 1080,20 1170,150" fill="url(#diamondTop)"/>
    <polygon points="990,150 1080,280 1170,150" fill="url(#diamondBottom)"/>
    <polygon points="1345,430 1400,350 1455,430" fill="url(#diamondTop)"/>
    <polygon points="1345,430 1400,510 1455,430" fill="url(#diamondBottom)"/>
  </g>

  <!-- diamond cluster, bottom-left -->
  <g opacity="0.75">
    <polygon points="90,740 230,540 370,740" fill="url(#diamondTop)"/>
    <polygon points="90,740 230,940 370,740" fill="url(#diamondBottom)"/>
    <polygon points="320,610 380,525 440,610" fill="url(#diamondTop)"/>
    <polygon points="320,610 380,695 440,610" fill="url(#diamondBottom)"/>
    <polygon points="85,845 120,795 155,845" fill="url(#diamondTop)"/>
    <polygon points="85,845 120,895 155,845" fill="url(#diamondBottom)"/>
  </g>

  <!-- winding route line, evoking a highway journey -->
  <path d="M -50 760 C 250 680, 350 840, 620 760 S 980 640, 1250 720 S 1550 660, 1700 700"
        fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 26" opacity="0.7"/>
  <path d="M -50 760 C 250 680, 350 840, 620 760 S 980 640, 1250 720 S 1550 660, 1700 700"
        fill="none" stroke="#bebebe" stroke-width="1.5" opacity="0.5"/>
</svg>
